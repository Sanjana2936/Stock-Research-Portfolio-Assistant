<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Research & Portfolio Assistant</title>
    <meta name="description" content="AI-powered stock research and portfolio risk analysis assistant.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>AI Stock Analyst</h1>
            <p>Institutional-grade research for retail investors</p>
        </header>

        <div class="glass-panel input-section">
            <form id="research-form">
                <div class="input-group">
                    <input type="text" id="query-input" placeholder="e.g. Give me a research summary of Infosys" required autocomplete="off">
                    <button type="submit" id="submit-btn">
                        <span class="btn-text">Analyze</span>
                        <div class="spinner hidden"></div>
                    </button>
                </div>
                <div class="suggestions">
                    <span class="suggestion-chip">Research TCS</span>
                    <span class="suggestion-chip">My portfolio is 40% TCS, 30% HDFC, 30% Reliance. Risk?</span>
                    <span class="suggestion-chip">What does P/E ratio mean?</span>
                </div>
            </form>
        </div>

        <div id="results-container" class="glass-panel results-section hidden">
            <div id="markdown-content" class="markdown-body">
                <!-- Report will be injected here -->
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
